<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mapa GPS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Mapa GPS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--accent:#2563eb;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--danger:#dc2626;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#f4f6fa;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.5;cursor:default}
.hidden{display:none!important}
.float{background:#fff;box-shadow:0 2px 10px rgba(15,23,42,.18),0 0 0 1px rgba(15,23,42,.05)}
.iconbtn{width:46px;height:46px;border-radius:23px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}
.iconbtn.on{background:var(--accent);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;font-weight:600;background:#eef2f7;text-align:center}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{color:var(--danger);background:#fef2f2}
.btn.wide{width:100%}
.muted{color:var(--muted)}.small{font-size:13px}
.warnbox{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:10px 12px;border-radius:10px;font-size:13.5px;margin-top:14px}

/* telas de lista */
.screen{position:fixed;inset:0;z-index:5;overflow:auto;background:#f4f6fa}
.wrap{max-width:560px;margin:0 auto;padding:calc(var(--st) + 20px) 16px calc(var(--sb) + 32px)}
.hhead{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.hhead h1{margin:0;font-size:23px}
.logo{width:48px;height:48px;border-radius:14px;background:var(--accent);display:grid;place-items:center;font-size:26px;flex:none}
.screen h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:24px 0 10px}
.mapcard{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border-radius:16px;padding:14px;text-align:left;box-shadow:0 1px 3px rgba(15,23,42,.08),0 0 0 1px rgba(15,23,42,.04);margin-bottom:10px}
.mapcard .mi{width:46px;height:46px;border-radius:12px;background:#eff6ff;display:grid;place-items:center;font-size:22px;flex:none}
.mapcard .t{flex:1;min-width:0}
.mapcard .t b{display:block;font-size:16px;overflow-wrap:anywhere}
.mapcard .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.mapcard .acts .btn{min-height:38px;padding:0 12px;font-size:14px}
.badge{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:#f1f5f9;color:#334155;flex:none;white-space:nowrap}
.badge.good{background:#dcfce7;color:#166534}.badge.bad{background:#fee2e2;color:#991b1b}.badge.mid{background:#fef3c7;color:#92400e}
.panel{background:#fff;border-radius:16px;padding:14px;box-shadow:0 1px 3px rgba(15,23,42,.08),0 0 0 1px rgba(15,23,42,.04)}
.panel ol{padding-left:18px;margin:0 0 12px}.panel li{margin:4px 0}
.footer{text-align:center;margin-top:30px}
.linkbtn{color:var(--muted);font-size:14px;padding:10px 14px;border-radius:10px}
.banner{display:flex;gap:10px;align-items:center;background:#fff7ed;border:1px solid #fed7aa;border-radius:14px;padding:12px 14px;width:100%;text-align:left;margin-bottom:12px}

/* tela do mapa */
#view{position:fixed;inset:0;touch-action:none;display:block;background:#d9dee5}
#top{position:fixed;z-index:10;top:calc(var(--st) + 10px);left:calc(var(--sl) + 10px);right:calc(var(--sr) + 10px);display:flex;gap:8px;align-items:center;pointer-events:none}
#top>*{pointer-events:auto}
#top .sp{flex:1;pointer-events:none}
#status{height:40px;border-radius:20px;padding:0 14px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;min-width:0;white-space:nowrap}
#status .dot{width:9px;height:9px;border-radius:50%;background:#94a3b8;flex:none}
#status.ok .dot{background:#16a34a}#status.warn .dot{background:#f59e0b}#status.err .dot{background:var(--danger)}
#statusText{overflow:hidden;text-overflow:ellipsis}
#modeBar{position:fixed;z-index:10;top:calc(var(--st) + 66px);left:50%;transform:translateX(-50%);display:flex;align-items:center;padding:3px;border-radius:13px;gap:2px;max-width:calc(100% - 20px);overflow-x:auto}
#modeBar button{padding:8px 12px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap}
#modeBar button.on{background:var(--accent);color:#fff}
#modeBar .mb-t{padding:0 10px;font-weight:600;font-size:13.5px;white-space:nowrap}
#hint{position:fixed;z-index:10;top:calc(var(--st) + 66px);left:50%;transform:translateX(-50%);background:rgba(15,23,42,.86);color:#fff;padding:8px 14px;border-radius:12px;font-size:13.5px;width:max-content;max-width:calc(100% - 24px);text-align:center;pointer-events:none;transition:opacity .4s}
body.hasbar #hint,body.hasbar #toast{top:calc(var(--st) + 114px)}
#hint.fade{opacity:0}
#fabs{position:fixed;z-index:10;right:calc(var(--sr) + 12px);bottom:calc(var(--sb) + 92px);display:flex;flex-direction:column;gap:10px}
#scale{position:fixed;z-index:10;left:calc(var(--sl) + 14px);bottom:calc(var(--sb) + 96px);font-size:11px;font-weight:700;color:var(--ink);text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;pointer-events:none}
#scaleBar{height:7px;border:2px solid var(--ink);border-top:0;margin-top:2px;background:rgba(255,255,255,.6)}
#satcard .inl{margin:0}
#satcard input[type=range]{flex:1;width:auto}
.attr{font-size:10.5px;color:var(--muted);margin-top:2px}
#bottom{position:fixed;z-index:11;left:calc(var(--sl) + 10px);right:calc(var(--sr) + 10px);bottom:calc(var(--sb) + 12px);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#bottom>*{pointer-events:auto}
#toolbar{display:flex;padding:4px;border-radius:16px;gap:2px}
#toolbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 8px;border-radius:12px;font-size:12px;font-weight:600;color:var(--muted);min-width:74px}
#toolbar button svg{width:22px;height:22px}
#toolbar button.on{background:#eff6ff;color:var(--accent)}
.card{width:100%;max-width:460px;border-radius:16px;padding:10px 12px}
.uphead{display:flex;align-items:center;gap:10px}
.upsw{width:18px;height:18px;border-radius:5px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.upinfo{flex:1;min-width:0}
.upinfo b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15.5px}
.upclose{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;flex:none;color:var(--muted);font-size:18px}
.upact{display:flex;gap:8px;margin-top:8px}
.upact .btn{flex:1;min-height:42px;padding:0 8px;font-size:14px}
.upadj .field{margin:10px 0 2px}
.cbig{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-top:2px}
.mhead{display:flex;align-items:center;gap:8px}
.rec{width:10px;height:10px;border-radius:50%;background:#94a3b8;flex:none}
.rec.on{background:#dc2626;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.3}}
.warnline{color:#b45309;font-size:13px;font-weight:600;margin-top:4px}
.inl{display:flex;gap:8px;align-items:center;margin-top:8px}
.inl input{width:90px}

/* folhas */
#backdrop{position:fixed;z-index:30;inset:0;background:rgba(15,23,42,.25)}
#sheet{position:fixed;z-index:31;left:0;right:0;bottom:0;margin:0 auto;max-width:500px;max-height:85vh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:10px 18px calc(var(--sb) + 18px);box-shadow:0 -8px 30px rgba(15,23,42,.2)}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:#cbd5e1;margin:0 auto 10px}
#sheet h3{margin:4px 0 12px;font-size:18px;overflow-wrap:anywhere}
#sheet h4{margin:20px 0 8px;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
textarea,input[type=text],input[type=number],select{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:inherit}
textarea{resize:vertical;min-height:70px}
.field{margin:12px 0}
.field>label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
input[type=range]{width:100%;accent-color:var(--accent)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.swatches button.on{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--accent)}
.seg{display:flex;background:#eef2f7;border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;padding:9px 8px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.15)}
.chk{display:flex;align-items:flex-start;gap:10px;font-weight:500;margin:12px 0;font-size:14px}
.chk input{width:20px;height:20px;flex:none;margin:0;accent-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap}
.row .sp{flex:1}
.or{text-align:center;color:var(--muted);font-size:13px;margin:14px 0 8px}
.list{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.list .it{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid var(--line);width:100%;text-align:left}
.list .it:first-child{border-top:0}
.list .it .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sumbig{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:2px 0 6px}
pre.sum{white-space:pre-wrap;font:inherit;font-size:14px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0 0;overflow-wrap:anywhere}
#toast{position:fixed;z-index:50;left:50%;top:calc(var(--st) + 66px);transform:translateX(-50%) translateY(-12px);background:rgba(15,23,42,.93);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;width:max-content;max-width:calc(100% - 32px);opacity:0;transition:.25s;pointer-events:none;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#loading{position:fixed;z-index:60;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.78);font-weight:600;text-align:center;padding:20px}
.spin{width:36px;height:36px;border:4px solid #cbd5e1;border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.progress{height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden;margin-top:8px}
.progress>div{height:100%;background:var(--accent);width:0;transition:width .1s linear}
</style>
</head>

<canvas id="view" class="hidden"></canvas>

<!-- ===== TELA DO MAPA ===== -->
<div id="mapui" class="hidden">
  <div id="top">
    <button id="backBtn" class="iconbtn float" aria-label="Voltar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div id="status" class="float"><span class="dot"></span><span id="statusText">—</span></div>
    <span class="sp"></span>
    <button id="menuBtn" class="iconbtn float" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  </div>

  </div>
  <div id="bottom">
    <div id="ctxcard" class="card float hidden"></div>
    <div id="meascard" class="card float hidden"></div>

  </div>
</div>

<!-- ===== TELA INICIAL ===== -->
<div id="home" class="screen hidden"><div class="wrap">
  <div class="hhead"><div class="logo">🗺️</div><div><h1>Mapa GPS</h1><div class="muted small" id="homeSync">&nbsp;</div></div></div>
  <div id="homeBanner"></div>
  <h2>Escolha o mapa</h2>
  <div id="homeList"></div>
  <button class="btn wide" id="homeJobs" style="margin-top:6px">📋 Histórico de medições</button>
  <div id="homeWarn" class="warnbox hidden"></div>
  <div class="footer"><button class="linkbtn" id="toAdmin">⚙️ Modo gestor</button></div>
</div></div>

<!-- ===== MODO GESTOR ===== -->
<div id="admin" class="screen hidden"><div class="wrap">
  <div class="hhead"><button class="iconbtn float" id="adminBack" aria-label="Voltar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><div><h1>Modo gestor</h1><div class="muted small">Configure os mapas e publique para os tratoristas</div></div></div>
  <button class="btn primary wide" id="newMap">＋ Novo mapa (PDF ou imagem)</button>

  <div id="adminList"></div>
  <h2>Publicar para os tratoristas</h2>
  <div class="panel" id="pubPanel"></div>
</div></div>

<div id="backdrop" class="hidden"></div>
<div id="sheet" class="hidden"><div class="grab"></div><div id="sheetBody"></div></div>
<div id="toast"></div>
<div id="loading" class="hidden"><div><div class="spin"></div><div id="loadingTxt">Carregando…</div></div></div>
<input type="file" id="fileInput" accept="application/pdf,.pdf,image/*" hidden>
<input type="file" id="pdfInput" accept="application/pdf,.pdf" hidden>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const cv = $('#view'), ctx = cv.getContext('2d');
const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
const COLORS = ['#111827', '#dc2626', '#2563eb', '#16a34a', '#ea580c', '#9333ea', '#ffffff'];
const UP_COLORS = ['#f59e0b', '#22c55e', '#3b82f6', '#ef4444', '#a855f7', '#ec4899', '#14b8a6', '#84cc16'];
const PICK_COLOR = '#0ea5e9';
const PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
const MAX_SIDE = 4096, MAX_AREA = 15e6;  // limite seguro para celulares (inclusive iPhone)
const CELL = 1;                           // célula de 1 m para medir área trabalhada

// Projeção UTM (elipsoide GRS80/WGS84 — SIRGAS 2000), séries de Krüger (precisão sub-milimétrica)
const UTM = (() => {
  const a = 6378137, f = 1 / 298.257222101, k0 = 0.9996, D = Math.PI / 180;
  const n = f / (2 - f), n2 = n * n, n3 = n2 * n, n4 = n3 * n;
  const A = a / (1 + n) * (1 + n2 / 4 + n4 / 64);
  const al = [n / 2 - 2 * n2 / 3 + 5 * n3 / 16 + 41 * n4 / 180, 13 * n2 / 48 - 3 * n3 / 5 + 557 * n4 / 1440, 61 * n3 / 240 - 103 * n4 / 140, 49561 * n4 / 161280];
  const be = [n / 2 - 2 * n2 / 3 + 37 * n3 / 96 - n4 / 360, n2 / 48 + n3 / 15 - 437 * n4 / 1440, 17 * n3 / 480 - 37 * n4 / 840, 4397 * n4 / 161280];
  const de = [2 * n - 2 * n2 / 3 - 2 * n3 + 116 * n4 / 45, 7 * n2 / 3 - 8 * n3 / 5 - 227 * n4 / 45, 56 * n3 / 15 - 136 * n4 / 35, 4279 * n4 / 630];
  const c2 = 2 * Math.sqrt(n) / (1 + n);
  const lon0 = zone => ((zone - 1) * 6 - 180 + 3) * D;
  function fwd(lat, lon, zone, south) {
    const phi = lat * D, lam = lon * D - lon0(zone);
    const t = Math.sinh(Math.atanh(Math.sin(phi)) - c2 * Math.atanh(c2 * Math.sin(phi)));
    const xi = Math.atan2(t, Math.cos(lam)), eta = Math.atanh(Math.sin(lam) / Math.sqrt(1 + t * t));
    let E = eta, N = xi;
    for (let j = 1; j <= 4; j++) { E += al[j - 1] * Math.cos(2 * j * xi) * Math.sinh(2 * j * eta); N += al[j - 1] * Math.sin(2 * j * xi) * Math.cosh(2 * j * eta); }
    return { E: 500000 + k0 * A * E, N: (south ? 10000000 : 0) + k0 * A * N };
  }
  function inv(E, N, zone, south) {
    const xi = (N - (south ? 10000000 : 0)) / (k0 * A), eta = (E - 500000) / (k0 * A);
    let xp = xi, ep = eta;
    for (let j = 1; j <= 4; j++) { xp -= be[j - 1] * Math.sin(2 * j * xi) * Math.cosh(2 * j * eta); ep -= be[j - 1] * Math.cos(2 * j * xi) * Math.sinh(2 * j * eta); }
    const chi = Math.asin(Math.sin(xp) / Math.cosh(ep));
    let phi = chi;
    for (let j = 1; j <= 4; j++) phi += de[j - 1] * Math.sin(2 * j * chi);
    return { lat: phi / D, lon: (lon0(zone) + Math.atan2(Math.sinh(ep), Math.cos(xp))) / D };
  }
  const zoneOf = lon => Math.min(60, Math.max(1, Math.floor((lon + 180) / 6) + 1));
  return { fwd, inv, zoneOf };
})();

// Lê a barra de escala e o fuso UTM a partir do texto do PDF (itens do pdf.js: str, transform, width)
function detectPdfGeo(items) {
  const out = { mPerPt: null, ratio: null, zone: null, south: null, how: null };
  const nums = [];
  for (const it of items) {
    const s = String(it.str || '').trim();
    if (!/^(\d{1,3}(\.\d{3})+|\d+)(,\d+)?$/.test(s)) continue;
    nums.push({ v: parseFloat(s.replace(/\./g, '').replace(',', '.')), x: it.transform[4] + (it.width || 0) / 2, y: it.transform[5] });
  }
  let best = null;
  for (const z of nums) {
    if (z.v !== 0) continue;
    const row = nums.filter(n => Math.abs(n.y - z.y) < 2.5 && n.x > z.x + 1 && n.v > 0).sort((a, b) => a.x - b.x);
    if (row.length < 2) continue;
    const last = row[row.length - 1], k = (last.x - z.x) / last.v;
    let ok = k > 0;
    for (let i = 0; ok && i < row.length; i++) {
      if (i && row[i].v <= row[i - 1].v) ok = false;
      else if (Math.abs(z.x + row[i].v * k - row[i].x) > Math.max(1.5, 0.03 * (row[i].x - z.x))) ok = false;
    }
    if (!ok) continue;
    const km = items.some(it => /^km$/i.test(String(it.str).trim()) && Math.abs(it.transform[5] - z.y) < 25 && it.transform[4] > last.x - 60);
    const cand = { ptPerM: k / (km ? 1000 : 1), span: last.x - z.x };
    if (!best || cand.span > best.span) best = cand;
  }
  const PT = 0.0254 / 72;   // metros de papel por ponto PDF
  if (best) {
    let ratio = (1 / best.ptPerM) / PT;
    const snap = Math.round(ratio / 100) * 100;
    if (snap > 0 && Math.abs(snap - ratio) / ratio < 0.005) ratio = snap;
    if (ratio >= 200 && ratio <= 2e6) { out.ratio = ratio; out.mPerPt = ratio * PT; out.how = 'barra de escala do PDF'; }
  }
  const full = items.map(it => it.str).join(' ').replace(/\s+/g, ' ');
  if (!out.mPerPt) {
    const m = full.match(/\b1\s*[:/]\s*(\d{1,3}(?:\.\d{3})+|\d{3,7})\b/);
    if (m) { const r = +m[1].replace(/\./g, ''); if (r >= 200 && r <= 2e6) { out.ratio = r; out.mPerPt = r * PT; out.how = 'escala escrita no PDF'; } }
  }
  let m = full.match(/Fuso\s*:?\s*(\d{1,2})\s*(Sul|Norte|S\b|N\b)?/i);

const db = (() => {
  let p;
  const open = () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open('mapa-gps-v2', 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('kv'); d.createObjectStore('maps', { keyPath: 'id' }); d.createObjectStore('jobs', { keyPath: 'id' }); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const run = async (store, mode, fn) => {
    const d = await open();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode), q = fn(t.objectStore(store)); let out;
      if (q) q.onsuccess = () => { out = q.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  };
  return {
    get: (s, k) => run(s, 'readonly', st => st.get(k)),
    all: s => run(s, 'readonly', st => st.getAll()),
    put: (s, v, k) => run(s, 'readwrite', st => k === undefined ? st.put(v) : st.put(v, k)),
    del: (s, k) => run(s, 'readwrite', st => st.delete(k))

})();

/* ================= calibração ================= */
function parseCoords(s) {
  s = String(s || '').trim().replace(/[−–]/g, '-'); if (!s) return null;
  let a, b;
  const dms = [...s.matchAll(/(\d+(?:[.,]\d+)?)\s*°\s*(?:(\d+(?:[.,]\d+)?)\s*['′’]\s*)?(?:(\d+(?:[.,]\d+)?)\s*(?:["″”]|'')\s*)?([NSLOEW])/gi)];
  if (dms.length >= 2) {
    const conv = m => { let v = +m[1].replace(',', '.') + (+(m[2] || '0').replace(',', '.')) / 60 + (+(m[3] || '0').replace(',', '.')) / 3600; if (/[SOW]/i.test(m[4])) v = -v; return { v, isLat: /[NS]/i.test(m[4]) }; };
    const x = conv(dms[0]), y = conv(dms[1]);
    if (x.isLat) { a = x.v; b = y.v; } else { a = y.v; b = x.v; }
  } else {
    let nums;
    if (s.includes('.')) nums = s.match(/-?\d+(?:\.\d+)?/g);
    else {
      const parts = s.split(/[;\s]+/).filter(Boolean);
      if (parts.length === 2) nums = parts.map(p => p.replace(',', '.'));
      else { const c = s.split(','); nums = c.length === 4 ? [c[0] + '.' + c[1], c[2] + '.' + c[3]].map(t => t.replace(/\s/g, '')) : s.match(/-?\d+/g); }
    }
    if (!nums || nums.length < 2) return null;
    a = parseFloat(nums[0]); b = parseFloat(nums[1]);
  }
  if (!Number.isFinite(a) || !Number.isFinite(b) || Math.abs(a) > 90 || Math.abs(b) > 180) return null;
  return [a, b];
}
// aceita lat/lon ou UTM (E N) no fuso do mapa
function parseCoordsAny(str) {
  const ll = parseCoords(str); if (ll) return ll;   // primeiro tenta latitude/longitude
  const nums = String(str || '').replace(/[−–]/g, '-').match(/-?\d+(?:[.,]\d+)*/g);
  if (nums && nums.length >= 2) {
    const v = nums.slice(0, 2).map(t => { const c = t.replace(/\.(?=\d{3}(\D|$))/g, ''); return parseFloat(c.replace(',', '.')); });
    if (Math.abs(v[0]) > 1000 && Math.abs(v[1]) > 1000) {
      const g = S.map && S.map.geo;
      if (!g || !g.zone) return { error: 'Para usar UTM, defina o fuso do mapa em ☰ → Escala do mapa.' };
      const E = Math.min(v[0], v[1]), N = Math.max(v[0], v[1]);
      if (E < 100000 || E > 900000 || N < 0 || N > 10000000) return { error: 'Coordenada UTM fora do intervalo esperado.' };
      const ll = UTM.inv(E, N, g.zone, g.south !== false);
      return [ll.lat, ll.lon];
    }
  }
  return null;
}
function captureGps(secs, onProg) {
  let id = null, timer = null, done = false, abort;
  const samples = [], t0 = Date.now();
  const promise = new Promise((res, rej) => {
    if (!('geolocation' in navigator)) return rej(new Error('Este navegador não oferece localização.'));
    const stop = () => { done = true; if (id != null) navigator.geolocation.clearWatch(id); clearTimeout(timer); };
    abort = () => { if (!done) { stop(); rej(new Error('cancelado')); } };
    const finish = () => {
      if (done) return;
      if (!samples.length && Date.now() - t0 < 30000) { timer = setTimeout(finish, 1000); return; }
      stop();
      if (!samples.length) return rej(new Error('Sem sinal de GPS. Tente ao ar livre ou perto de uma janela.'));
      const best = Math.min(...samples.map(c => c.accuracy)), good = samples.filter(c => c.accuracy <= best * 2.5);
      let sw = 0, la = 0, lo = 0;
      good.forEach(c => { const w = 1 / Math.max(1, c.accuracy) ** 2; sw += w; la += c.latitude * w; lo += c.longitude * w; });
      res({ lat: la / sw, lon: lo / sw, acc: best, n: samples.length });
    };

async function fileToMapCanvas(f) {
  const isPdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
  if (isPdf) {
    if (!window.pdfjsLib) throw new Error('o leitor de PDF não carregou. Para criar mapas a partir de PDF é preciso internet.');
    const doc = await pdfjsLib.getDocument({ data: new Uint8Array(await f.arrayBuffer()) }).promise;
    let pn = 1;
    if (doc.numPages > 1) { loading(false); pn = await choosePage(doc.numPages); if (!pn) return null; loading(true, 'Convertendo o PDF…'); }
    const page = await doc.getPage(pn), vp1 = page.getViewport({ scale: 1 });
    const sc = Math.min(MAX_SIDE / Math.max(vp1.width, vp1.height), Math.sqrt(MAX_AREA / (vp1.width * vp1.height)), 8);
    const vp = page.getViewport({ scale: sc });
    const c = document.createElement('canvas'); c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
    await page.render({ canvasContext: g, viewport: vp }).promise;
    const k = c.width / vp1.width;   // pixels da imagem por ponto do PDF
    let geo = null;
    try {
      const tc = await page.getTextContent(), d = detectPdfGeo(tc.items || []);
      if (d.mPerPt) geo = { mPerPx: d.mPerPt / k, ratio: d.ratio, src: d.how, zone: d.zone, south: d.south, rotated: false };
      else if (d.zone) geo = { mPerPx: 0, ratio: null, src: null, zone: d.zone, south: d.south, rotated: false };
    } catch (e) { console.warn('texto do PDF', e); }
    return { c, geo, paperMmPerPx: 25.4 / 72 / k };
  }
  if (!(f.type.startsWith('image/') || /\.(png|jpe?g|webp|gif)$/i.test(f.name))) throw new Error('escolha um PDF ou uma imagem');
  const url = URL.createObjectURL(f);
  try {
    const img = await loadImg(url), w = img.naturalWidth, h = img.naturalHeight;
    const sc = Math.min(1, MAX_SIDE / Math.max(w, h), Math.sqrt(MAX_AREA / (w * h)));
    const c = document.createElement('canvas'); c.width = Math.round(w * sc); c.height = Math.round(h * sc);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    return { c, geo: null, paperMmPerPx: null };
  } finally { URL.revokeObjectURL(url); }
}

/* --- pacote para publicar (zip sem compressão) --- */
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(files) {

  const now = new Date();
  const dt = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)) & 0xffff;
  const dd = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xffff;
  for (const f of files) {
    const name = enc.encode(f.name), data = f.data, crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
    h.setUint16(10, dt, true); h.setUint16(12, dd, true); h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true);
    h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
    parts.push(new Uint8Array(h.buffer), name, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
    c.setUint16(12, dt, true); c.setUint16(14, dd, true); c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true);
    c.setUint16(28, name.length, true); c.setUint32(42, offset, true);
    central.push(new Uint8Array(c.buffer), name);
    offset += 30 + name.length + data.length;
  }
  const cdSize = central.reduce((a, b) => a + b.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, cdSize, true); e.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(e.buffer)], { type: 'application/zip' });
}
function publishedMeta(m) {
  return {
    id: m.id, name: m.name, updated: m.updated, created: m.created || 0, w: m.w, h: m.h, affine: !!m.affine, geo: m.geo || null, paperMmPerPx: m.paperMmPerPx || null,
    calib: (m.calib || []).filter(hasCoord).map(p => ({ id: p.id, x: p.x, y: p.y, lat: p.lat, lon: p.lon })),
    ups: (m.ups || []).map(u => ({ id: u.id, name: u.name, color: u.color, mask: u.mask, parts: u.parts, area: u.area, cx: u.cx, cy: u.cy })),
    labels: m.labels || []

}
function buildPackage(maps) {
  const enc = new TextEncoder(), files = [], warns = [];
  const index = { app: 'mapa-gps', version: 3, published: new Date().toISOString(), maps: [] };
  for (const m of maps) {
    // nomes fixos por mapa: ao enviar de novo para o GitHub, o arquivo novo substitui o antigo
    const jn = `mapas/${m.id}.json`, img = `mapas/${m.id}.jpg`;
    files.push({ name: jn, data: enc.encode(JSON.stringify(publishedMeta(m))) });
    files.push({ name: img, data: new Uint8Array(m.imgBuf) });
    const cal = (m.calib || []).filter(hasCoord).length >= needPts(m);
    if (!cal) warns.push(`“${m.name}” está sem calibração: o tratorista não verá a posição dele.`);
    if (!(m.ups || []).length) warns.push(`“${m.name}” não tem nenhuma UP marcada.`);
    index.maps.push({ id: m.id, name: m.name, updated: m.updated, json: `${jn}?v=${m.updated.toString(36)}`, img: `${img}?v=${(m.created || 0).toString(36)}`, ups: (m.ups || []).length, calibrated: cal, bytes: m.imgBuf.byteLength });
  }
  index.maps.sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
  files.push({ name: 'mapas/index.json', data: enc.encode(JSON.stringify(index, null, 1)) });
  return { files, index, warns };
}

/* --- publicação direta no GitHub (sem precisar entrar no site do GitHub) --- */
async function ghGet() { try { return await db.get('kv', 'gh'); } catch (e) { return null; } }
function guessRepo() {
  const h = location.hostname; if (!/\.github\.io$/i.test(h)) return '';
  const owner = h.split('.')[0], seg = location.pathname.split('/').filter(Boolean)[0];
  return owner + '/' + (seg && !/\.html?$/i.test(seg) ? seg : h);
}
function ghErrText(st, msg) {
  if (st === 401) return 'Token inválido ou vencido. Gere um novo token no GitHub e salve de novo em “Conexão”.';
  if (st === 403) return 'O token não tem permissão para gravar neste repositório (precisa da permissão Contents: Read and write).' + (msg ? ' (' + msg + ')' : '');
  if (st === 404) return 'Repositório não encontrado. Confira o nome (usuário/repositório) e se o token tem acesso a ele.';
  if (st === 409) return 'O repositório está vazio. Envie primeiro os arquivos do app (passo a passo de instalação).';
  if (st === 422) return 'O GitHub recusou os dados: ' + msg;
  return `Erro do GitHub (${st})${msg ? ': ' + msg : ''}`;
}
async function ghApi(cfg, path, method = 'GET', body) {
  let r;
  try {
    r = await fetch('https://api.github.com/repos/' + cfg.repo + path, {
      method, cache: 'no-store',
      headers: { 'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + cfg.token, 'X-GitHub-Api-Version': '2022-11-28', ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined
    });
  } catch (e) { throw new Error('Sem internet ou o GitHub não respondeu. Tente de novo.'); }
  if (!r.ok) { let msg = ''; try { msg = (await r.json()).message || ''; } catch (e) { } const err = new Error(ghErrText(r.status, msg)); err.status = r.status; throw err; }
  return r.status === 204 ? null : r.json();
}
function bufToB64(data) {
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1] || ''); fr.onerror = () => rej(fr.error); fr.readAsDataURL(new Blob([data])); });
}
async function publishToGitHub() {
  const cfg = await ghGet(); if (!cfg || !cfg.token) { openGhSheet(); return; }
  let maps = []; try { maps = await db.all('maps'); } catch (e) { }
  if (S.map && S.role === 'edit') await saveWorkspaceMap();
  try { maps = await db.all('maps'); } catch (e) { }
  if (!maps.length && !(await confirmSheet('Não há nenhum mapa neste aparelho. Publicar assim vai tirar todos os mapas do site.', 'Publicar mesmo assim'))) return;
  const pkg = buildPackage(maps);
  loading(true, 'Conectando ao GitHub…');
  try {
    const repo = await ghApi(cfg, '');
    if (repo.permissions && repo.permissions.push === false) throw new Error('Este token não pode gravar no repositório (precisa da permissão Contents: Read and write).');
    const branch = cfg.branch || repo.default_branch || 'main';
    const ref = await ghApi(cfg, '/git/ref/heads/' + encodeURIComponent(branch));
    const headSha = ref.object.sha;
    const commit = await ghApi(cfg, '/git/commits/' + headSha);
    const tr = await ghApi(cfg, '/git/trees/' + commit.tree.sha + '?recursive=1');
    const existing = new Map((tr.tree || []).filter(t => t.type === 'blob').map(t => [t.path, t.sha]));
    const entries = [], send = pkg.files.filter(f => f.name.endsWith('.json') || !existing.has(f.name));
    let i = 0;
    for (const f of send) {
      i++; loading(true, `Enviando arquivo ${i} de ${send.length}…`);
      const blob = await ghApi(cfg, '/git/blobs', 'POST', { content: await bufToB64(f.data), encoding: 'base64' });
      entries.push({ path: f.name, mode: '100644', type: 'blob', sha: blob.sha });

    const tree = await ghApi(cfg, '/git/trees', 'POST', { base_tree: commit.tree.sha, tree: entries });
    const nc = await ghApi(cfg, '/git/commits', 'POST', { message: `Mapas atualizados pelo app (${maps.length} mapa${maps.length === 1 ? '' : 's'})`, tree: tree.sha, parents: [headSha] });
    await ghApi(cfg, '/git/refs/heads/' + encodeURIComponent(branch), 'PATCH', { sha: nc.sha });
    await db.put('kv', { at: Date.now(), maps: Object.fromEntries(maps.map(m => [m.id, m.updated])) }, 'pubState');
    loading(false);
    openSheet(`<h3>Publicado ✓</h3><p>${maps.length} mapa(s) enviados para <b>${esc(cfg.repo)}</b>. Em 1 a 3 minutos o site atualiza, e os celulares recebem os mapas ao abrir o app com internet.</p>
      ${pkg.warns.length ? `<div class="warnbox">${pkg.warns.map(esc).join('<br>')}</div>` : ''}
      <div class="row"><span class="sp"></span><button class="btn primary" id="pbok">OK</button></div>`);
    $('#pbok').onclick = () => { closeSheet(); if (S.screen === 'admin') renderAdmin(); };
  } catch (e) {
    loading(false); console.error(e);
    openSheet(`<h3>Não consegui publicar</h3><p>${esc(e.message || e)}</p><p class="muted small">Seus mapas continuam salvos neste aparelho.</p>
      <div class="row"><button class="btn" id="pbcfg">⚙️ Conexão</button><span class="sp"></span><button class="btn primary" id="pbok">OK</button></div>`);
    $('#pbok').onclick = closeSheet; $('#pbcfg').onclick = () => { closeSheet(); openGhSheet(); };
  }
}
async function openGhSheet() {
  const cfg = (await ghGet()) || {};
  openSheet(`<h3>☁️ Conectar ao GitHub</h3>
    <p class="muted small" style="margin-top:-4px">Feito <b>uma vez</b> neste aparelho. Depois é só tocar em <b>Publicar agora</b>.</p>
    <div class="field"><label>Repositório (usuário/nome)</label><input type="text" id="ghRepo" placeholder="seu-usuario/mapa-gps" value="${esc(cfg.repo || guessRepo())}" autocapitalize="off" autocomplete="off" spellcheck="false"></div>
    <div class="field"><label>Token de acesso</label><input type="password" id="ghTok" placeholder="${cfg.token ? '•••••• já salvo (deixe em branco para manter)' : 'github_pat_…'}" autocomplete="off"></div>
    <details class="small"><summary><b>Como criar o token</b></summary><ol style="padding-left:18px;margin:8px 0">
      <li>No GitHub, clique na sua foto (canto superior direito) → <b>Settings</b>.</li>
      <li>No fim do menu da esquerda: <b>Developer settings</b> → <b>Personal access tokens</b> → <b>Fine-grained tokens</b> → <b>Generate new token</b>.</li>
      <li>Dê um nome (ex.: Mapa GPS) e escolha a validade (ex.: 1 ano).</li>
      <li>Em <b>Repository access</b>, escolha <b>Only select repositories</b> e marque o repositório do app.</li>
      <li>Em <b>Permissions</b>, dê a permissão <b>Contents</b> como <b>Read and write</b>.</li>
      <li>Clique em <b>Generate token</b>, copie o código (começa com <b>github_pat_</b>) e cole aqui.</li></ol></details>
    <p class="muted small">O token fica guardado só neste aparelho. Não coloque nos celulares dos tratoristas.</p>
    <div id="ghMsg" class="small"></div>
    <div class="row">${cfg.token ? '<button class="btn danger" id="ghDel">Desconectar</button>' : ''}<span class="sp"></span><button class="btn" id="ghNo">Cancelar</button><button class="btn primary" id="ghOk">Testar e salvar</button></div>`);
  $('#ghNo').onclick = closeSheet;
  if ($('#ghDel')) $('#ghDel').onclick = async () => { await db.del('kv', 'gh').catch(() => { }); closeSheet(); toast('Desconectado do GitHub.'); renderAdmin(); };
  $('#ghOk').onclick = async () => {
    const repo = $('#ghRepo').value.trim().replace(/^https?:\/\/(www\.)?github\.com\//i, '').replace(/\.git$/i, '').replace(/\/+$/, '');
    const token = $('#ghTok').value.trim() || cfg.token;
    const msg = $('#ghMsg');
    if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) { msg.innerHTML = '⚠️ Escreva o repositório como <b>usuário/nome</b> (ex.: joao/mapa-gps).'; return; }
    if (!token) { msg.innerHTML = '⚠️ Cole o token de acesso.'; return; }
    msg.textContent = 'Testando…'; $('#ghOk').disabled = true;
    try {
      const r = await ghApi({ repo, token }, '');
      if (r.permissions && r.permissions.push === false) throw new Error('Este token só consegue ler o repositório. Dê a permissão Contents: Read and write.');
      await db.put('kv', { repo: r.full_name || repo, token, branch: r.default_branch || 'main' }, 'gh');
      closeSheet(); toast('Conectado ao GitHub ✓ Agora é só tocar em Publicar.', 4500); renderAdmin();
    } catch (e) { msg.innerHTML = '⚠️ ' + esc(e.message); $('#ghOk').disabled = false; }
  };
}
async function renderPublishPanel(maps) {
  const cfg = await ghGet(); let st = null; try { st = await db.get('kv', 'pubState'); } catch (e) { }
  const pend = maps.filter(m => !st || !st.maps || st.maps[m.id] !== m.updated).length;
  const removed = st && st.maps ? Object.keys(st.maps).filter(id => !maps.some(m => m.id === id)).length : 0;
  const auto = !!(cfg && cfg.token);
  let html = `<ol class="small" style="margin-top:0">
      <li>Toque em <b>Gerar arquivos para o GitHub</b>.</li>
      <li>Descompacte e envie a <b>pasta mapas</b> no repositório (<b>Add file → Upload files</b> → <b>Commit changes</b>).</li></ol>`;
  if (st) html += `<div class="small" style="margin-bottom:8px">Últimos arquivos gerados${auto ? '/publicados' : ''}: ${fmtDate(st.at)}</div>`;
  if (pend || removed) html += `<div class="warnbox" style="margin:0 0 10px">${pend ? `${pend} mapa(s) com alterações ainda não enviadas.` : ''}${removed ? ` ${removed} mapa(s) excluído(s) ainda aparecem para os tratoristas.` : ''}</div>`;
  else if (st) html += `<div class="small" style="color:#166534;margin-bottom:10px">✓ Nada pendente.</div>`;
  html += `<button class="btn primary wide" id="exportPkg">📦 Gerar arquivos para o GitHub</button>`;
  if (auto) html += `<button class="btn wide" id="pubGo" style="margin-top:8px">☁️ Publicar direto (conectado a ${esc(cfg.repo)})</button>`;
  html += `<button class="btn wide" id="importSite" style="margin-top:8px">⬇️ Trazer os mapas publicados para editar</button>
    <div style="text-align:center"><button class="linkbtn" id="pubCfg">${auto ? 'Configurar publicação direta' : 'Avançado: publicar direto pelo app (token do GitHub)'}</button></div>`;
  $('#pubPanel').innerHTML = html;
  if ($('#pubGo')) $('#pubGo').onclick = publishToGitHub;
  $('#pubCfg').onclick = openGhSheet;
  $('#importSite').onclick = importFromSite;
  $('#exportPkg').onclick = exportPackage;
  return { st, cfg };
}

/* ================= tela inicial (tratorista) ================= */
async function renderHome() {
  showScreen('home'); S.backTo = 'home';
  const list = $('#homeList');
  if (!window.isSecureContext && location.protocol !== 'file:') { $('#homeWarn').innerHTML = '⚠️ Abra este app pelo endereço <b>https://</b> do site, senão o GPS não funciona.'; $('#homeWarn').classList.remove('hidden'); }
  let cached = null; try { cached = JSON.parse(localStorage.getItem('pubIndex') || 'null'); } catch (e) { }
  if (cached) drawHomeList(cached); else list.innerHTML = '<p class="muted">Carregando mapas…</p>';
  renderHomeBanner();
  let idx = null;
  if (location.protocol !== 'file:') { try { idx = await fetchJSON('mapas/index.json'); } catch (e) { } }
  if (idx && idx.maps) { try { localStorage.setItem('pubIndex', JSON.stringify(idx)); } catch (e) { } }
  else idx = cached;
  S.pubIndex = idx;
  $('#homeSync').textContent = !idx || !idx.published ? '' : (navigator.onLine ? `Mapas publicados em ${fmtDate(idx.published)}` : 'Sem internet — usando os mapas salvos no celular');
  drawHomeList(idx);
  if (idx) syncOffline(idx);
}
function drawHomeList(idx) {
  const list = $('#homeList');
  if (S.screen !== 'home') return;
  if (!idx || !idx.maps || !idx.maps.length) {
    list.innerHTML = `<div class="panel"><b>Nenhum mapa disponível ainda.</b><p class="muted small" style="margin-bottom:0">O gestor precisa configurar os mapas no <b>Modo gestor</b> e publicar no site. Depois abra o app com internet uma vez.</p></div>`;
    return;
  }
  list.innerHTML = idx.maps.map((m, i) => `<button class="mapcard" data-m="${i}"><div class="mi">🗺️</div><div class="t"><b>${esc(m.name)}</b><span class="muted small">${m.ups} UP(s)${m.calibrated ? '' : ' · sem calibração'}</span></div>${m._off === true ? '<span class="badge good">offline ✓</span>' : m._off === false ? '<span class="badge mid">baixando…</span>' : ''}</button>`).join('');
  $$('#homeList [data-m]').forEach(b => b.onclick = () => openPublished(idx.maps[+b.dataset.m]));
}
async function renderHomeBanner() {
  const el = $('#homeBanner'); el.innerHTML = '';
  let m = null; try { m = await db.get('kv', 'meas'); } catch (e) { }
  if (!m) return;
  el.innerHTML = `<button class="banner" id="hbm"><span style="font-size:22px">⏸</span><span><b>Medição pausada</b><br><span class="small muted">${esc(m.mapName)} · desde ${fmtDate(m.started)} — toque para continuar</span></span></button>`;
  $('#hbm').onclick = () => { const e = S.pubIndex && S.pubIndex.maps.find(x => x.id === m.mapId); if (e) openPublished(e); else toast('Abra esse mapa pelo Modo gestor para continuar.'); };
}
async function syncOffline(idx) {
  if (!('caches' in window) || location.protocol === 'file:') return;
  try {
    const cache = await caches.open('mapa-gps-mapas');
    const abs = u => new URL(u, location.href).href, want = new Set();
    idx.maps.forEach(m => { want.add(abs(m.json)); want.add(abs(m.img)); });
    for (const req of await cache.keys()) if (!want.has(req.url)) await cache.delete(req);
    for (const m of idx.maps) { m._off = !!(await cache.match(abs(m.json))) && !!(await cache.match(abs(m.img))); }
    drawHomeList(idx);
    for (const m of idx.maps) {
      if (m._off) continue;
      try {
        for (const u of [m.json, m.img]) { if (await cache.match(abs(u))) continue; const r = await fetch(abs(u)); if (r.ok) await cache.put(abs(u), r); }
        m._off = true;
      } catch (e) { m._off = false; }
      drawHomeList(idx);
    }
    try { localStorage.setItem('pubIndex', JSON.stringify(idx)); } catch (e) { }
  } catch (e) { console.warn(e); }
}
async function openPublished(entry) {
  loading(true, 'Abrindo mapa…');
  try {
    let meta;
    try { meta = await fetchJSON(entry.json, 15000); }
    catch (e) { const c = 'caches' in window ? await caches.match(new URL(entry.json, location.href).href) : null; if (!c) throw e; meta = await c.json(); }
    S.backTo = 'home';
    await openMap(meta, 'drive', entry.img);
  } catch (e) { console.error(e); toast('Não consegui abrir este mapa' + (navigator.onLine ? '.' : ': ele ainda não foi baixado para uso sem internet.'), 5000); renderHome(); }
  finally { loading(false); }
}
$('#homeJobs').onclick = openJobsList;

/* ================= início ================= */
if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !(SIM && window.self !== window.top)) {
  navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW', e));
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { });
}
window.addEventListener('online', () => { if (S.screen === 'home') renderHome(); });
window.__mapaGps = { S, computeTransform, geoToMap, mapToGeo, parseCoords, parseCoordsAny, floodUp, polyMetrics, UTM, detectPdfGeo, mapToUtm };
resize();
renderHome();
})();
